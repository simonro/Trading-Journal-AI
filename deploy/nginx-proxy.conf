# Reverse proxy that terminates TLS for both the frontend (static build) and
# the backend API, so every client (Mac, iOS, web, LAN) connects over HTTPS
# on a single port. Reuses the same cert/key uploaded via
# Settings > Security > /api/settings/tls/certificate (mounted read-only from
# the backend_certs volume as fullchain.pem / privkey.pem).
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /api/ {
        proxy_pass http://backend:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }

    location /uploads/ {
        proxy_pass http://backend:8010;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
