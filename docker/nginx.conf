server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Hashed build files never change, so they can be cached; index.html must not be, or an
    # update keeps showing the old app.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
